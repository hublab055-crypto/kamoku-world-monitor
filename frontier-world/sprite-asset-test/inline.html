<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Frontier World 画像動作テスト</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101923;color:#f5f8fa;font-family:system-ui,-apple-system,sans-serif}main{max-width:810px;margin:auto;padding:14px}h2{font-size:19px}h3{font-size:16px;margin:10px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.pane{border:1px solid #3b5562;background:#1d303e;padding:12px;border-radius:14px}
.stage{position:relative;min-height:285px;border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:linear-gradient(#82b3ad 0 78%,#8ba978 78% 100%)}
.stage::after{content:"";position:absolute;bottom:19px;width:100%;border-bottom:1px dashed #ffffff99;pointer-events:none}
.stage canvas{height:255px;width:194px;object-fit:contain;image-rendering:auto}
.dialogue{height:190px;display:flex;align-items:end;background:#183f4b;border:2px solid #79c7ba;border-radius:10px;overflow:hidden}
.dialogue canvas{height:184px;width:179px;flex:none;object-fit:contain;image-rendering:auto}.dialogue .say{align-self:center;line-height:1.7;padding:8px;font-size:13px}
.say b{color:#a2f3df}button{border:1px solid #4b7482;background:#244757;color:#fff;border-radius:8px;padding:8px 12px;cursor:pointer;font-size:13px}button.active{background:#087e80;border-color:#93ede1}
.buttons{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}#status{font-size:12px;color:#a8f0c8}p{font-size:12px;line-height:1.7;color:#bcd0d9;margin:7px 0}
@media(max-width:620px){.grid{grid-template-columns:1fr}.stage{min-height:260px}.dialogue{height:195px}}
</style><main><h2>フロンティアワールド｜アニメーションテスト</h2><p id="status">画像を読み込み中...</p>
<div class="grid"><section class="pane"><h3>歩行（4方向・各4コマ）</h3>
<div class="stage"><canvas id="walk" width="160" height="215"></canvas></div><div class="buttons" id="directions"></div>
<div class="buttons"><button id="toggleWalk">停止</button><button id="singleStep">1コマ送り</button></div><p>足元の位置を固定。方向切り替えで立ち姿と歩行を比較できます。</p>
</section><section class="pane"><h3>セリフ・表情（9種類）</h3>
<div class="dialogue"><canvas id="face" width="210" height="218"></canvas><div class="say"><b>Mio</b><div id="line">今日は何をしようか？</div></div></div>
<div class="buttons" id="expressions"></div><div class="buttons"><button class="active" id="blinkAuto">瞬き 自動</button><button class="active" id="talkAuto">口パク 自動</button></div>
<p>顔の外枠は同じ描画座標に固定。目と口の差分だけを切り替えています。</p></section></div></main>
<script>
const B=async path=>{const r=await fetch(path);if(!r.ok)throw Error("画像ファイルを取得できません("+r.status+")");const str=(await r.text()).trim();const im=new Image();im.src="data:image/webp;base64,"+str;await im.decode();return im};
const BASE=new URL(".",location.href);const W=40,H=52,FW=70,FH=73,dirs=["front","left","right","back"],names=["通常","瞬き","口閉","口半開","口開","喜び","怒り","悲しみ","笑顔"];
let wa=null,fa=null,d=0,frame=0,playing=true,expr=0,autoblink=true,autotalk=true,now=0,previous=0,walkClock=0,lastBlink=0;
const wc=document.getElementById("walk"),fc=document.getElementById("face"),wctx=wc.getContext("2d"),fctx=fc.getContext("2d");
const dirsEl=document.getElementById("directions");["正面","左","右","背面"].forEach((s,i)=>{const btn=document.createElement("button");btn.textContent=s;btn.onclick=()=>{d=i;frame=0;paint();select(dirsEl,i)};dirsEl.append(btn)});
const exEl=document.getElementById("expressions");names.forEach((s,i)=>{const b=document.createElement("button");b.textContent=s;b.onclick=()=>{expr=i;select(exEl,i);document.getElementById("line").textContent=["今日は何をしようか？","……","聞いているよ。","そうだね。","いっしょに行こう！","やったー！","もう！","ちょっと悲しいな……","楽しいね！"][i];paint()};exEl.append(b)});
function select(el,i){[...el.children].forEach((b,j)=>b.classList.toggle("active",j===i))}select(dirsEl,0);select(exEl,0);
document.getElementById("toggleWalk").onclick=()=>{playing=!playing;document.getElementById("toggleWalk").textContent=playing?"停止":"再生";paint()};
document.getElementById("singleStep").onclick=()=>{playing=false;document.getElementById("toggleWalk").textContent="再生";frame=(frame+1)%4;paint()};
document.getElementById("blinkAuto").onclick=e=>{autoblink=!autoblink;e.target.classList.toggle("active",autoblink);e.target.textContent=autoblink?"瞬き 自動":"瞬き 停止"};
document.getElementById("talkAuto").onclick=e=>{autotalk=!autotalk;e.target.classList.toggle("active",autotalk);e.target.textContent=autotalk?"口パク 自動":"口パク 停止"};
function paint(){if(wa){wctx.clearRect(0,0,wc.width,wc.height);wctx.drawImage(wa, (playing?([0,1,2,3][frame]):frame)*W,d*H,W,H,17,5,126,197)}
if(fa){let p=expr;if(autotalk&&now%720<540)p=[2,3,4,3][Math.floor(now/180)%4];if(autoblink&&now-lastBlink<150)p=1;fctx.clearRect(0,0,fc.width,fc.height);fctx.drawImage(fa,(p%3)*FW,Math.floor(p/3)*FH,FW,FH,0,0,210,218)}}
function tick(ms){if(previous===0)previous=ms;const dt=Math.min(80,ms-previous);previous=ms;now+=dt;
if(playing){walkClock+=dt;if(walkClock>170){walkClock=0;frame=(frame+1)%4}}
if(autoblink&&now-lastBlink>3300)lastBlink=now;paint();requestAnimationFrame(tick)}
Promise.all([B(new URL("walk-atlas.b64",BASE)),B(new URL("face-atlas.b64",BASE))]).then(([w,f])=>{wa=w;fa=f;document.getElementById("status").textContent="読み込み完了：4方向16コマ・表情9種類（軽量プレビュー）";requestAnimationFrame(tick)}).catch(e=>{document.getElementById("status").textContent="画像を読み込めませんでした: "+e.message});
</script></html>
