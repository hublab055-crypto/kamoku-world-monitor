<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Frontier World - Asset Integrated Prototype</title>
<style>
:root {
  --panel:#1d1f21; --card:#272a2d; --text:#f5f5f5; --muted:#b8bdc3;
  --border:#41464c; --accent:#88b7ff; --good:#6fd07a; --warn:#e8b85b; --bad:#e96e76;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#111;color:var(--text);font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif}
#app{max-width:900px;margin:auto;padding:8px}
.game{background:#1a1d1f;border:1px solid var(--border);border-radius:18px;overflow:hidden}
.stage{position:relative;background:#203828}
canvas#world{display:block;width:100%;height:auto;touch-action:none;user-select:none;-webkit-user-select:none}
.hudCoord{position:absolute;right:10px;top:10px;background:#0009;border-radius:14px;padding:8px 12px;font-weight:700}
.joy{position:absolute;left:12px;bottom:12px;width:132px;height:132px;border-radius:50%;background:#0b211fb8;border:2px solid #ffffff55;touch-action:none;user-select:none;-webkit-user-select:none}
.joy:before{content:"";position:absolute;inset:16px;border-radius:50%;border:1px solid #ffffff22}
.knob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px;border-radius:50%;background:#e7ecec;border:2px solid #ffffff99;box-shadow:0 2px 8px #0008}
.controls{padding:8px;background:#25282b;border-top:1px solid var(--border)}
#message{min-height:28px;padding:4px 2px;color:#f0f0f0}
.cmdrow{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
button{font:inherit;color:var(--text);background:#282b2f;border:1px solid var(--border);border-radius:13px;min-height:48px}
.cmd{font-size:24px}
button:active{transform:translateY(1px)}
.panel{margin-top:8px;background:var(--panel);border:1px solid var(--border);border-radius:15px;padding:12px}
.hidden{display:none}
.panelHead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.close{min-width:44px}
.dialog{display:grid;grid-template-columns:112px minmax(0,1fr);gap:12px;align-items:center}
#portrait{width:112px;height:112px;border-radius:14px;background:#303438;border:1px solid var(--border)}
.name{font-size:20px;font-weight:800}
#dialogText{margin-top:6px;line-height:1.7;min-height:54px}
.replies{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.replies button{padding:0 12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tileCard{border:1px solid var(--border);border-radius:12px;padding:10px;background:#24272a}
.settingsRow{display:grid;grid-template-columns:84px 1fr;gap:8px;align-items:center;margin:7px 0}
select{width:100%;min-height:44px;background:#22262a;color:var(--text);border:1px solid var(--border);border-radius:10px;padding:0 10px;font-size:16px}
.note{color:var(--muted);font-size:13px}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:#ddd;margin-top:7px}
@media(max-width:520px) {
  #app{padding:0}
  .game{border-radius:0}
  .dialog{grid-template-columns:88px minmax(0,1fr)}
  #portrait{width:88px;height:88px}
  .joy{width:118px;height:118px}
  .knob{width:52px;height:52px;margin:-26px}
}
</style>
</head>
<body>
<div id="app" tabindex="0">
  <div class="game">
    <div class="stage">
      <canvas id="world" width="900" height="900" aria-label="ゲームマップ"></canvas>
      <div id="coord" class="hudCoord">0,0</div>
      <div id="joy" class="joy" aria-label="移動スティック"><div id="knob" class="knob"></div></div>
    </div>
    <div class="controls">
      <div id="message" aria-live="polite">生成したグラフィックを読み込み中…</div>
      <div class="cmdrow">
        <button class="cmd" data-slot="0" type="button">⚡</button>
        <button class="cmd" data-slot="1" type="button">💬</button>
        <button class="cmd" data-slot="2" type="button">📦</button>
        <button class="cmd" data-slot="3" type="button">💤</button>
        <button class="cmd" data-slot="4" type="button">🔨</button>
        <button id="settings" class="cmd" type="button">⚙️</button>
      </div>
    </div>
  </div>

  <section id="dialogPanel" class="panel hidden">
    <div class="dialog">
      <canvas id="portrait" width="128" height="128" aria-label="Mioの顔"></canvas>
      <div>
        <div class="panelHead"><div id="speaker" class="name">Mio</div><button id="closeDialog" class="close" type="button">✕</button></div>
        <div id="dialogText">おはよう！</div>
        <div class="replies">
          <button data-reply="hello" type="button">👋 挨拶</button>
          <button data-reply="work" type="button">🪵 仕事</button>
          <button data-reply="life" type="button">⛺ 暮らし</button>
        </div>
      </div>
    </div>
  </section>

  <section id="panel" class="panel hidden">
    <div class="panelHead"><strong id="panelTitle">📦</strong><button id="closePanel" class="close" type="button">✕</button></div>
    <div id="panelBody"></div>
  </section>

  <section id="settingsPanel" class="panel hidden">
    <div class="panelHead"><strong>⚙️ 5ボタン設定</strong><button id="closeSettings" class="close" type="button">✕</button></div>
    <div id="slotEditor"></div>
    <div class="note">⚡💬📦💤🔨 の5枠を、🏹⚔️🛡️🧪🌱などへ変更できます。</div>
  </section>
</div>

function makeMap(){
 state.tiles=Array.from({length:MAP},()=>Array.from({length:MAP},()=>({ground:'grass'})));
 state.objects=[];
 state.buildings=[];
 for(let x=4;x<86;x++) state.tiles[50][x].ground='road';
 for(let y=18;y<76;y++) state.tiles[y][47].ground='road';

 // 約20×5マスの森
 for(let y=24;y<29;y++) for(let x=31;x<51;x++){
   if((x+y)%7!==0) state.objects.push({type:((x+y)%3===0?'tree2':'tree'),x,y,solid:true,gather:'wood'});
 }
 // 散在資源
 [[32,39,'rock'],[58,44,'rock'],[57,39,'grass'],[35,53,'tree2'],[61,51,'tree'],[52,37,'berry'],[60,55,'bush'],[42,39,'grass']]
 .forEach(v=>state.objects.push({x:v[0],y:v[1],type:v[2],solid:false,gather:v[2]==='rock'?'stone':v[2].startsWith('tree')?'wood':'food'}));

 tents.forEach(t=>{
   state.buildings.push(t);
   if(t.type!=='shop') {
     // 中身：2x2のテントにベッドロールとチェスト
     t.furniture=[{type:'bedroll',x:t.x+.10,y:t.y+.60},{type:'chest',x:t.x+1.08,y:t.y+.62}];
   }
 });
 // 小さな家
 state.buildings.push({id:'house1',x:59,y:47,owner:'Common',type:'house',access:'public',furniture:[]});
 state.objects.push({type:'campfire',x:48,y:54,solid:false});
 state.objects.push({type:'logs',x:58,y:54,solid:false});
}

function camera(){return {x:state.player.x-12,y:state.player.y-12};}
function worldToScreen(x,y){const c=camera();return {x:(x-c.x)*TILE,y:(y-c.y)*TILE};}

function inBuilding(b,x=state.player.x,y=state.player.y){
 if(b.type==='house') return x>=b.x && x<b.x+3 && y>=b.y && y<b.y+3;
 return x>=b.x && x<b.x+2 && y>=b.y && y<b.y+2;
}
function canEnter(b){return b.access!=='locked';}
function buildingAt(x,y){
 return state.buildings.find(b=>inBuilding(b,x,y))||null;
}
function blocked(x,y){
 if(x<0||y<0||x>=MAP||y>=MAP) return true;
 const b=buildingAt(x,y);
 if(b && !canEnter(b)) return true;
 return false;
}

function setDirFromVector(o,dx,dy){
 if(Math.abs(dx)>Math.abs(dy)) o.dir=dx<0?'left':'right';
 else o.dir=dy<0?'back':'front';
}

function movePlayer(dx,dy,dt){
 const p=state.player;
 p.moving=true;
 if(p.st<=0){p.st=0;state.resting=true;msg('💤 スタミナ0。強制休息中。');return;}
 setDirFromVector(p,dx,dy);
 const sp=4.35;
 const nx=p.x+dx*sp*dt, ny=p.y+dy*sp*dt;
 if(!blocked(nx,p.y)) p.x=clamp(nx,0,MAP-1);
 else {const b=buildingAt(nx,p.y);if(b&&b.access==='locked') msg('🔒 '+b.owner+'のテントには入れない。');}
 if(!blocked(p.x,ny)) p.y=clamp(ny,0,MAP-1);
 else {const b=buildingAt(p.x,ny);if(b&&b.access==='locked') msg('🔒 '+b.owner+'のテントには入れない。');}
 p.st=clamp(p.st-dt*.38,0,100);
 state.resting=false;
}

function updateNPC(n,dt){
 n.moving=false;
 n.timer-=dt;
 if(n.timer<=0){
   n.timer=2+Math.random()*3;
   const home=state.buildings.find(b=>b.id===n.id);
   if(home){n.tx=home.x+.5+(Math.random()-.5)*3;n.ty=home.y+1.5+(Math.random()-.5)*3;}
 }
 const dx=n.tx-n.x,dy=n.ty-n.y,d=Math.hypot(dx,dy);
 if(d>.08){
   n.moving=true;
   setDirFromVector(n,dx,dy);
   const sp=.55;
   n.x+=dx/d*sp*dt;n.y+=dy/d*sp*dt;
 }
}

function update(dt){
 state.player.moving=false;
 state.hour+=dt*.04;
 if(state.hour>=24){state.hour-=24;state.day++;}
 let dx=joy.x,dy=joy.y;
 if(tap&&!joy.active){
   const ax=tap.x-state.player.x,ay=tap.y-state.player.y,d=Math.hypot(ax,ay);
   if(d<.12) tap=null; else {dx=ax/d;dy=ay/d;}
 }
 if(Math.hypot(dx,dy)>.08) movePlayer(dx,dy,dt);
 else if(state.resting||state.player.st<=0){
   const b=buildingAt(state.player.x,state.player.y);
   const rate=b?2.8:1.0;
   state.player.st=clamp(state.player.st+dt*rate,0,100);
   if(state.player.st>=20 && state.player.st<21) state.resting=false;
 }
 state.player.hunger=clamp(state.player.hunger-dt*.03,0,100);
 state.npcs.forEach(n=>updateNPC(n,dt));
}

function tileColor(g){return g==='road'?'#8a765d':'#356342';}
function drawTile(px,py,g){
 ctx.fillStyle=tileColor(g);ctx.fillRect(px,py,TILE,TILE);
 ctx.strokeStyle='rgba(255,255,255,.055)';ctx.strokeRect(px,py,TILE,TILE);
}

function drawBuilding(b){
 const s=worldToScreen(b.x,b.y);
 if(b.type==='house'){
   drawAsset('house',s.x-TILE*.55,s.y-TILE*1.55,TILE*4.4,TILE*4.4,1);
   return;
 }
 const inside=inBuilding(b);
 const alpha=inside&&canEnter(b)?.24:1;
 if(b.furniture && inside){
   for(const f of b.furniture){
     const fs=worldToScreen(f.x,f.y);
     drawAsset(f.type,fs.x-TILE*.05,fs.y-TILE*.10,TILE*.95,TILE*.95,1);
   }
 }
 const name=b.type==='shop'?'shop':b.type==='locked'?'locked':'tent';
 drawAsset(name,s.x-TILE*.78,s.y-TILE*1.72,TILE*3.7,TILE*3.95,alpha);
 if(b.type==='locked'){
   ctx.fillStyle='#000b';ctx.fillRect(s.x+2,s.y+TILE*1.05,TILE*2.15,24);
   ctx.fillStyle='#fff';ctx.font='12px system-ui';ctx.textAlign='center';ctx.fillText('🔒 立入禁止',s.x+TILE*1.05,s.y+TILE*1.05+16);
 }
 if(b.type==='shop'){
   ctx.fillStyle='#000a';ctx.fillRect(s.x+18,s.y+4,TILE*1.7,22);
   ctx.fillStyle='#fff';ctx.font='12px system-ui';ctx.textAlign='center';ctx.fillText('🏪 営業中',s.x+TILE*1.05,s.y+19);
 }
}

function drawObject(o){
 const s=worldToScreen(o.x,o.y);
 if(o.type==='tree'||o.type==='tree2') drawAsset(o.type,s.x-TILE*.78,s.y-TILE*2.08,TILE*2.2,TILE*3.0,1);
 else if(o.type==='rock') drawAsset('rock',s.x-TILE*.42,s.y-TILE*.52,TILE*1.05,TILE*1.05,1);
 else if(o.type==='grass') drawAsset('grass',s.x-TILE*.36,s.y-TILE*.52,TILE*.92,TILE*1.00,1);
 else if(o.type==='berry') drawAsset('berry',s.x-TILE*.46,s.y-TILE*.62,TILE*1.02,TILE*1.02,1);
 else if(o.type==='bush') drawAsset('bush',s.x-TILE*.52,s.y-TILE*.66,TILE*1.12,TILE*1.10,1);
 else if(o.type==='logs') drawAsset('logs',s.x-TILE*.50,s.y-TILE*.36,TILE*1.15,TILE*.78,1);
 else if(o.type==='campfire') drawAsset('campfire',s.x-TILE*.52,s.y-TILE*.98,TILE*1.10,TILE*1.34,1);
}

function bar(x,y,w,v,color){

 ctx.fillStyle=color;ctx.fillRect(x-w/2,y,w*clamp(v,0,100)/100,4);
}

 bar(s.x+TILE/2,s.y-18,32,p.hp||100,'#e86d75');

 bar(s.x+TILE/2,s.y-6,32,p.hunger||80,'#e8b85b');
 if(sprite!=='you' && CHAR_V3[`characters/${sprite}/${p.dir}/${p.moving ? Math.floor(performance.now()/170)%3 : 1}.png`] && charAtlasV3.complete){
   const frame=p.moving ? Math.floor(performance.now()/170)%3 : 1;

   ctx.drawImage(charAtlasV3,a[0],a[1],a[2],a[3],s.x+TILE/2-w/2,s.y+TILE/2-h*.70,w,h);

function draw(){
 ctx.clearRect(0,0,W,H);
 const c=camera();
 for(let sy=0;sy<VIEW;sy++) for(let sx=0;sx<VIEW;sx++){
   const wx=Math.floor(c.x)+sx,wy=Math.floor(c.y)+sy;
   const px=sx*TILE-(c.x-Math.floor(c.x))*TILE, py=sy*TILE-(c.y-Math.floor(c.y))*TILE;
   if(wx<0||wy<0||wx>=MAP||wy>=MAP){ctx.fillStyle='#203126';ctx.fillRect(px,py,TILE,TILE);continue;}
   drawTile(px,py,state.tiles[wy][wx].ground);
 }
 state.objects.forEach(drawObject);
 state.buildings.forEach(drawBuilding);
 state.npcs.forEach(n=>drawPerson(n,n.sprite));
 drawPerson({...state.player,name:'YOU'},'you');
 drawHUD();
 $('#coord').textContent=Math.round(state.player.x)+','+Math.round(state.player.y);
}

function nearestResource(){
 let best=null,bd=1.65;
 for(const o of state.objects){
   if(!o.gather) continue;
   const d=Math.hypot(o.x-state.player.x,o.y-state.player.y);
   if(d<bd){bd=d;best=o;}
 }
 return best;
}
function action(){
 const o=nearestResource();
 if(!o){const b=buildingAt(state.player.x,state.player.y);if(b&&b.type==='shop'){openShop();return;}msg('⚡ 近くに採取対象がない。');return;}
 if(o.gather==='wood'){state.player.inv.wood++;state.player.st=clamp(state.player.st-3,0,100);msg('🪵 木材 +1');}
 else if(o.gather==='stone'){state.player.inv.stone++;state.player.st=clamp(state.player.st-4,0,100);msg('🪨 石材 +1');}
 else {state.player.inv.food++;state.player.st=clamp(state.player.st-2,0,100);msg('🍎 食料 +1');}
 state.objects=state.objects.filter(x=>x!==o);
}

function nearestNPC(){
 let best=null,bd=2.1;
 for(const n of state.npcs){
  const d=Math.hypot(n.x-state.player.x,n.y-state.player.y);
  if(d<bd){bd=d;best=n;}
 }
 return best;
}
function stopFaceTimers(){

}
function startBlink(){

}
function typeLine(text){

 if(speakTimer) clearInterval(speakTimer);
 faceState.talk=true;refreshFace();startBlink();

   i++; el.textContent=text.slice(0,i);
   faceState.talk=!faceState.talk;refreshFace();

 },45);
}

const joyBase=$('#joy'),knob=$('#knob');
function joyMove(e){
 e.preventDefault();
 const r=joyBase.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
 const dx=e.clientX-cx,dy=e.clientY-cy,max=r.width*.31,d=Math.hypot(dx,dy)||1,s=Math.min(1,max/d);
 const px=dx*s,py=dy*s;
 knob.style.transform=`translate3d(${px}px,${py}px,0)`;
 joy.x=px/max;joy.y=py/max;tap=null;state.resting=false;
}
joyBase.addEventListener('pointerdown',e=>{joy.active=true;joy.pid=e.pointerId;joyBase.setPointerCapture(e.pointerId);joyMove(e);},{passive:false});
joyBase.addEventListener('pointermove',e=>{if(joy.active&&e.pointerId===joy.pid)joyMove(e);},{passive:false});
function joyEnd(e){if(e.pointerId!==joy.pid)return;e.preventDefault();joy.active=false;joy.pid=null;joy.x=joy.y=0;knob.style.transform='translate3d(0,0,0)';}
joyBase.addEventListener('pointerup',joyEnd,{passive:false});
joyBase.addEventListener('pointercancel',joyEnd,{passive:false});
joyBase.addEventListener('contextmenu',e=>e.preventDefault());

canvas.addEventListener('pointerdown',e=>{

 const sx=(e.clientX-r.left)*W/r.width,sy=(e.clientY-r.top)*H/r.height,c=camera();
 const tx=c.x+sx/TILE,ty=c.y+sy/TILE;
 if(!blocked(tx,ty)){tap={x:tx,y:ty};state.resting=false;}
 else {const b=buildingAt(tx,ty);if(b)msg('🔒 '+b.owner+'のテントには入れない。');}
 root.focus();
});

 if(k==='w'||e.key==='ArrowUp')joy.y=-1;
 if(k==='s'||e.key==='ArrowDown')joy.y=1;
 if(k==='a'||e.key==='ArrowLeft')joy.x=-1;
 if(k==='d'||e.key==='ArrowRight')joy.x=1;
 if(k==='e'||e.key===' '){e.preventDefault();runCommand(slots[0]);}
});
root.addEventListener('keyup',e=>{
 const k=e.key.toLowerCase();
 if(k==='w'||k==='s'||e.key==='ArrowUp'||e.key==='ArrowDown')joy.y=0;
 if(k==='a'||k==='d'||e.key==='ArrowLeft'||e.key==='ArrowRight')joy.x=0;
});

let raf=0;
function loop(t){
 const dt=Math.min(.04,(t-last)/1000);last=t;update(dt);draw();raf=requestAnimationFrame(loop);
}
function start(){
 makeMap();renderButtons();refreshFace();msg('✅ 新しい4方向×3コマ歩行アニメと高品質会話顔を反映しました。');
 last=performance.now();raf=requestAnimationFrame(loop);
}
let ready=0;
function oneReady(){ready++;if(ready===3)start();}
if(atlasImg.complete)oneReady();else atlasImg.addEventListener('load',oneReady,{once:true});
if(charAtlasV3.complete)oneReady();else charAtlasV3.addEventListener('load',oneReady,{once:true});
if(portraitAtlasV3.complete)oneReady();else portraitAtlasV3.addEventListener('load',oneReady,{once:true});
})();
</script>
