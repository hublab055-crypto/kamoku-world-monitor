<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Frontier World | 惑星一周テスト</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#081626;color:#f5f9fa;font-family:system-ui,-apple-system,"Yu Gothic",sans-serif}
#view{position:fixed;inset:0;display:block;touch-action:none}
.panel{position:fixed;z-index:5;left:8px;right:8px;top:8px;pointer-events:none}
.bar{display:flex;flex-wrap:wrap;gap:6px;pointer-events:auto}
button,.back{font:700 12px system-ui,sans-serif;border:1px solid #8bc6b6;background:#142e40eb;color:white;padding:9px 11px;border-radius:10px;min-height:37px;text-decoration:none;cursor:pointer;touch-action:none}
button.selected{background:#45816f}
#status{font-size:11px;line-height:1.6;margin-top:7px;background:#112c3ce8;border:1px solid #3c7483;border-radius:11px;padding:8px 11px;max-width:490px}
#status strong{color:#d5ffe0}
.controls{position:fixed;z-index:5;bottom:calc(8px + env(safe-area-inset-bottom));left:8px;right:8px;display:flex;justify-content:space-between;gap:8px;align-items:end;pointer-events:none}
.controls button{pointer-events:auto}
.pad{display:grid;grid-template-columns:repeat(3,minmax(48px,1fr));gap:5px;width:min(58%,225px)}
.pad button{min-height:51px}
.pad button.active{background:#517f80}
.actions{display:flex;flex-direction:column;gap:5px;min-width:120px}
.label{position:fixed;z-index:2;display:none;transform:translate(-50%,-100%);background:#102436d9;border:1px solid #b0ceb7;border-radius:8px;padding:3px 6px;font-size:11px;white-space:nowrap;pointer-events:none}
#warning{position:fixed;inset:20%;display:none;z-index:10;padding:15px;background:#1a2838;border-radius:12px}
@media(max-width:450px){button,.back{font-size:11px;padding:7px 8px}.actions{min-width:105px}.pad button{min-height:45px}#status{font-size:10px}.bar{gap:4px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
</head>
<body>
<canvas id="view" aria-label="球体惑星と歩行テスト"></canvas>
<div class="panel">
 <div class="bar">
  <a class="back" href="./" aria-label="元の村へ戻る">✕ 村へ戻る</a>
  <button type="button" id="globe">🌍 全景</button>
  <button type="button" id="ground">🚶 地表</button>
  <button type="button" id="origin">⌂ 出発地</button>
  <button type="button" id="sex" title="モデルの性別を切り替え">♂/♀ モデル</button>
 </div>
 <div id="status" role="status" aria-live="off">🪐 球体惑星を準備中…</div>
</div>
<div class="controls">
 <div class="pad">
  <span></span><button data-hold="forward" aria-label="前進">▲ 前進</button><span></span>
  <button data-hold="left" aria-label="左旋回">◀ 左</button>
  <button data-hold="backward" aria-label="後退">▼ 後退</button>
  <button data-hold="right" aria-label="右旋回">右 ▶</button>
 </div>
 <div class="actions">
  <button type="button" id="east">🧭 東へ向く</button>
  <button type="button" id="north">🧭 北へ向く</button>
  <button type="button" id="lap">🌐 一周テスト</button>
  <button type="button" id="stop">■ 停止</button>
 </div>
</div>
<div id="warning"></div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {clone as cloneSkinned} from 'three/addons/utils/SkeletonUtils.js';

const PI=Math.PI, TAU=PI*2, HALF=PI/2;
const R=32, C=TAU*R, SPEED=4.8, AUTO_SPEED=10, TURN=1.5;
const SAVE='frontier-planet-traverse-v1';
const el=id=>document.getElementById(id);
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const normAngle=a=>(a%TAU+TAU)%TAU;
const normLon=a=>Math.atan2(Math.sin(a),Math.cos(a));
const radians=d=>d*PI/180, degrees=r=>r*180/PI;
let saved={};try{saved=JSON.parse(localStorage.getItem(SAVE)||'{}')||{};}catch(_){}
const nav={
 lat:clamp(Number(saved.lat)||0,-HALF,HALF),
 lon:normLon(Number(saved.lon)||0),
 heading:normAngle(radians(Number.isFinite(Number(saved.heading))?Number(saved.heading):90)),
 mode:saved.mode==='ground'?'ground':'globe',
 laps:Math.max(0,Math.floor(Number(saved.laps)||0)),
 total:Math.max(0,Number(saved.total)||0),
 auto:false,autoDistance:0,finished:false
};
const keys={forward:false,backward:false,left:false,right:false};
const normalUp=new THREE.Vector3(0,1,0);
function normal(lat,lon){
 return new THREE.Vector3(Math.cos(lat)*Math.cos(lon),Math.sin(lat),Math.cos(lat)*Math.sin(lon));
}
function basis(n){
 const h=Math.hypot(n.x,n.z);
 const east=h>1e-9?new THREE.Vector3(-n.z/h,0,n.x/h):new THREE.Vector3(0,0,1);
 return {east:east,north:east.clone().cross(n).normalize()};
}
function headingVector(n,a){
 const b=basis(n);
 return b.north.multiplyScalar(Math.cos(a)).addScaledVector(b.east,Math.sin(a)).normalize();
}
function scalar(n){
 const x=n.x*R,y=n.y*R,z=n.z*R;
 const wave=.64*Math.sin(x*.12+Math.sin(z*.21))+.53*Math.cos(z*.10+y*.15)
 +.43*Math.sin(y*.17-x*.10)+.23*Math.cos(x*.29+z*.31+y*.08)
 +.12*Math.sin(x*.53+y*.48-z*.31);
 return wave+Math.max(0,n.x-.92)*8.5;
}
function elevation(n){return Math.min(1.3,Math.max(0,scalar(n)-.12)*.52);}
function kind(n){
 const t=scalar(n);
 if(Math.abs(n.y)>.89)return t>.12?'氷雪の大地':'極海';
 if(t<=.12)return '海洋';
 if(t>.8)return '高地・山岳';
 if(Math.abs(n.y)<.56&&Math.sin(n.x*24+n.z*13)>.6)return '乾燥地';
 return '草原・森林';
}
function color(n){
 const t=scalar(n);
 if(Math.abs(n.y)>.89)return new THREE.Color(t>.12?'#e2edef':'#9ac7db');
 if(t<=.12)return new THREE.Color(t<-.28?'#235487':'#4089ae');
 if(t<.2)return new THREE.Color('#c0bf91');
 if(t>.95)return new THREE.Color('#8f9c8b');
 if(Math.abs(n.y)<.56&&Math.sin(n.x*24+n.z*13)>.6)return new THREE.Color('#c6a875');
 return new THREE.Color(t>.5?'#478064':'#6a9c60');
}
function save(){
 try{localStorage.setItem(SAVE,JSON.stringify({
 lat:nav.lat,lon:nav.lon,heading:degrees(nav.heading),mode:nav.mode,laps:nav.laps,total:nav.total
 }));}catch(_){}
}
function advance(distance){
 // Great-circle motion plus parallel transport of the character's facing.
 const n=normal(nav.lat,nav.lon);
 const forward=headingVector(n,nav.heading);
 const axis=n.clone().cross(forward).normalize();
 const n2=n.clone().applyAxisAngle(axis,distance/R).normalize();
 const forward2=forward.clone().applyAxisAngle(axis,distance/R).projectOnPlane(n2).normalize();
 const b=basis(n2);
 nav.lat=Math.asin(clamp(n2.y,-1,1));
 nav.lon=normLon(Math.atan2(n2.z,n2.x));
 nav.heading=normAngle(Math.atan2(forward2.dot(b.east),forward2.dot(b.north)));
 nav.total+=Math.abs(distance);
}
const renderer=new THREE.WebGLRenderer({canvas:el('view'),antialias:true,powerPreference:'default'});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
const scene=new THREE.Scene();
scene.background=new THREE.Color('#071424');
const camera=new THREE.PerspectiveCamera(58,1,.05,800);
const orbit=new OrbitControls(camera,renderer.domElement);
orbit.enableDamping=true;orbit.enablePan=false;orbit.minDistance=R*1.18;orbit.maxDistance=R*5.8;
const sun=new THREE.DirectionalLight('#fff0d7',3);
sun.position.set(80,60,40);scene.add(sun,new THREE.AmbientLight('#acbbcf',.9));
function makePlanet(){
 const g=new THREE.SphereGeometry(R,176,112);
 const p=g.attributes.position,colors=new Float32Array(p.count*3),n=new THREE.Vector3();
 for(let i=0;i<p.count;i++){
   n.fromBufferAttribute(p,i).normalize();
   const h=elevation(n),c=color(n);
   p.setXYZ(i,n.x*(R+h),n.y*(R+h),n.z*(R+h));
   colors[3*i]=c.r;colors[3*i+1]=c.g;colors[3*i+2]=c.b;
 }
 p.needsUpdate=true;g.setAttribute('color',new THREE.BufferAttribute(colors,3));g.computeVertexNormals();
 const m=new THREE.MeshStandardMaterial({vertexColors:true,roughness:1,metalness:0});
 const planet=new THREE.Mesh(g,m);planet.name='Planet sphere (continuous)';scene.add(planet);
 const atmosphere=new THREE.Mesh(new THREE.SphereGeometry(R+1,64,36),new THREE.MeshBasicMaterial({
  color:'#5aace5',transparent:true,opacity:.09,side:THREE.BackSide,depthWrite:false
 }));
 scene.add(atmosphere);
}
makePlanet();
function makeStars(){
 const coords=[];
 function seeded(i){const x=Math.sin(i*121.151+75.217)*43758.545;return x-Math.floor(x);}
 for(let i=0;i<700;i++){
  const a=seeded(i*2)*TAU,y=2*seeded(i*2+1)-1,s=Math.sqrt(1-y*y),d=300;
  coords.push(s*Math.cos(a)*d,y*d,s*Math.sin(a)*d);
 }
 const g=new THREE.BufferGeometry();
 g.setAttribute('position',new THREE.Float32BufferAttribute(coords,3));
 scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:'#c4d6e9',size:.8,sizeAttenuation:false})));
}
makeStars();
const markers=[];
function landmark(name,latDeg,lonDeg){
 const n=normal(radians(latDeg),radians(lonDeg));
 const group=new THREE.Group();
 group.position.copy(n).multiplyScalar(R+elevation(n)+.08);
 group.quaternion.setFromUnitVectors(normalUp,n);
 const pole=new THREE.Mesh(new THREE.CylinderGeometry(.035,.035,1.4,7),new THREE.MeshStandardMaterial({color:'#decda7'}));
 pole.position.y=.7;group.add(pole);
 const flag=new THREE.Mesh(new THREE.ConeGeometry(.26,.45,3),new THREE.MeshStandardMaterial({color:'#dbb660',side:THREE.DoubleSide}));
 flag.rotation.z=-HALF;flag.position.set(.2,1.3,0);group.add(flag);scene.add(group);
 const badge=document.createElement('div');badge.className='label';badge.textContent='⌖ '+name;document.body.append(badge);
 markers.push({group,badge,n});
}
landmark('開拓キャンプ',0,0);
landmark('北方観測所',53,75);
landmark('西方海域',12,-118);
landmark('南方探査点',-46,155);
function camp(){
 const n=normal(0,0),g=new THREE.Group();
 g.position.copy(n).multiplyScalar(R+elevation(n)+.09);
 g.quaternion.setFromUnitVectors(normalUp,n);
 const mat=new THREE.MeshStandardMaterial({color:'#cbb397',roughness:1,side:THREE.DoubleSide});
 for(const x of [-1.2,1.2]){
   const tent=new THREE.Mesh(new THREE.ConeGeometry(.72,1.2,4),mat);
   tent.rotation.y=PI/4;tent.position.set(x,.62,1.7);g.add(tent);
 }
 const fire=new THREE.Mesh(new THREE.ConeGeometry(.19,.45,7),new THREE.MeshStandardMaterial({color:'#ffaa38',emissive:'#a64b10'}));
 fire.position.set(0,.24,2.2);g.add(fire);scene.add(g);
}
camp();
const body=new THREE.Group();scene.add(body);
let mixer=null,clips=[],playing=null,isFallback=true,modelName='仮3Dモデル',avatarLoadSequence=0;
function placeholder(){
 const g=new THREE.Group();
 const cloth=new THREE.MeshStandardMaterial({color:'#608a87'});
 const skin=new THREE.MeshStandardMaterial({color:'#d9b093'});
 const boot=new THREE.MeshStandardMaterial({color:'#544439'});
 const part=(geom,mat,x,y,z,root=g)=>{
  const obj=new THREE.Mesh(geom,mat);obj.position.set(x,y,z);root.add(obj);return obj;
 };
 part(new THREE.CapsuleGeometry(.22,.48,4,12),cloth,0,1.25,0);
 part(new THREE.SphereGeometry(.15,16,10),skin,0,1.75,.02);
 const legs=[];
 for(const side of [-1,1]){
  const limb=new THREE.Group();limb.position.set(side*.12,.85,0);g.add(limb);
  part(new THREE.CapsuleGeometry(.09,.53,3,10),cloth,0,-.37,0,limb);
  part(new THREE.BoxGeometry(.21,.13,.31),boot,0,-.76,.04,limb);legs.push(limb);
  const arm=new THREE.Group();arm.position.set(side*.25,1.47,0);g.add(arm);
  part(new THREE.CapsuleGeometry(.07,.39,3,9),skin,0,-.29,0,arm);
  if(side<0)g.userData.leftArm=arm;else g.userData.rightArm=arm;
 }
 g.userData.legs=legs;return g;
}
body.add(placeholder());
async function getModelCache(sex){
 return await new Promise((resolve,reject)=>{
  const req=indexedDB.open('frontier-3d-avatar-cache',1);
  req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('models'))req.result.createObjectStore('models');};
  req.onerror=()=>reject(req.error);
  req.onsuccess=()=>{
   const db=req.result,tx=db.transaction('models','readonly');
   const get=tx.objectStore('models').get(sex);
   get.onsuccess=()=>{resolve(get.result||null);db.close();};
   get.onerror=()=>{reject(get.error);db.close();};
  };
 });
}
async function loadAvatar(){
 const sequence=++avatarLoadSequence;
 const loader=new GLTFLoader();
 const sex=localStorage.getItem('frontier-planet-avatar-sex')==='female'?'female':'male';
 let model=null;
 try{
  const cached=await getModelCache(sex);
  if(cached)model=await loader.parseAsync(cached,'');
 }catch(e){console.info('[Planet] cache unavailable',e);}
 if(!model){
  for(const kind of ['high','mobile']){
   try{model=await loader.loadAsync('./assets/avatars/frontier_'+sex+'_'+kind+'.glb');break;}
   catch(_){}
  }
 }
 if(sequence!==avatarLoadSequence||!model)return;
 try{
  const rig=cloneSkinned(model.scene);
  mixer?.stopAllAction();playing=null;body.clear();body.add(rig);mixer=new THREE.AnimationMixer(rig);
  clips=model.animations||[];isFallback=false;modelName='GLB '+sex;
 }catch(e){console.warn('[Planet] GLB cannot be displayed',e);}
}
loadAvatar();
function placeAvatar(){
 const n=normal(nav.lat,nav.lon),f=headingVector(n,nav.heading);
 const right=n.clone().cross(f).normalize();
 const m=new THREE.Matrix4().makeBasis(right,n,f);
 body.quaternion.setFromRotationMatrix(m);
 body.position.copy(n).multiplyScalar(R+elevation(n)+.08);
}
function animation(walking,dt,t){
 if(mixer&&clips.length){
  const choice=THREE.AnimationClip.findByName(clips,walking?'Walk':'Idle')||clips[0];
  if(choice&&(!playing||playing.getClip()!==choice)){
   const next=mixer.clipAction(choice);next.reset().fadeIn(.18).play();
   if(playing)playing.fadeOut(.18);playing=next;
  }
  mixer.update(dt);
 }else if(isFallback&&body.children[0]?.userData?.legs){
  const p=body.children[0],angle=walking?Math.sin(t*.01)*.47:0;
  p.userData.legs[0].rotation.x=angle;p.userData.legs[1].rotation.x=-angle;
  p.userData.leftArm.rotation.x=-angle*.6;p.userData.rightArm.rotation.x=angle*.6;
 }
}
function setMode(mode){
 nav.mode=mode;orbit.enabled=mode==='globe';el('globe').classList.toggle('selected',mode==='globe');
 el('ground').classList.toggle('selected',mode==='ground');
 if(mode==='globe'){
  camera.up.set(0,1,0);
  camera.position.copy(normal(nav.lat,nav.lon).multiplyScalar(R*2.3)).add(new THREE.Vector3(8,12,8));
  orbit.target.set(0,0,0);orbit.update();
 }
 save();
}
function cameraStep(){
 if(nav.mode==='globe'){orbit.update();return;}
 const n=normal(nav.lat,nav.lon),f=headingVector(n,nav.heading);
 const p=n.clone().multiplyScalar(R+elevation(n)+1.3);
 camera.position.copy(p).addScaledVector(n,3.0).addScaledVector(f,-5.3);
 camera.up.copy(n);camera.lookAt(p);
}
function updateHud(){
 const N=degrees(nav.lat),E=degrees(nav.lon),H=degrees(nav.heading);
 const ns=N>=0?'N':'S',ew=E>=0?'E':'W';
 let summary=nav.auto?'一周テスト進捗 '+(nav.autoDistance/C*100).toFixed(1)+'%':nav.finished?'✅ 惑星一周を達成！':'累計移動 '+nav.total.toFixed(0)+' 惑星単位';
 el('status').innerHTML='<strong>緯度 '+Math.abs(N).toFixed(2)+'°'+ns+' ／ 経度 '+Math.abs(E).toFixed(2)+'°'+ew+
 '</strong>　方位 '+Math.round(H)+'°<br>地形：'+kind(normal(nav.lat,nav.lon))+
 ' ／ アバター：'+modelName+'<br>'+summary+' ／ 通算 '+nav.laps+' 周 ／ 赤道一周 '+C.toFixed(1)+' 単位'+
 '<div style="opacity:.75">球体の小型テスト惑星。開拓村のセーブデータは変更しません。</div>';
}
function updateMarkers(){
 for(const m of markers){
  const v=m.group.position.clone().addScaledVector(m.n,1.6).project(camera);
  const facing=camera.position.clone().sub(m.group.position).dot(m.n)>0;
  const x=(v.x+1)*innerWidth/2,y=(1-v.y)*innerHeight/2;
  if(!facing||v.z<0||v.z>1||x<0||x>innerWidth||y<0||y>innerHeight){m.badge.style.display='none';continue;}
  m.badge.style.display='block';m.badge.style.left=x+'px';m.badge.style.top=y+'px';
 }
}
function resize(){
 camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight,false);
}
addEventListener('resize',resize);resize();setMode(nav.mode);
let previous=performance.now(),lastHud=0,lastSave=0;
function loop(t){
 requestAnimationFrame(loop);
 const dt=Math.min(.05,Math.max(0,(t-previous)/1000));previous=t;
 let walking=false;
 if(nav.auto){
  const d=Math.min(AUTO_SPEED*dt,C-nav.autoDistance);
  if(d>0){advance(d);nav.autoDistance+=d;walking=true;}
  if(nav.autoDistance>=C-1e-7){
   nav.auto=false;nav.finished=true;nav.laps++;save();
  }
 }else{
  const turn=(keys.right?1:0)-(keys.left?1:0);
  if(turn)nav.heading=normAngle(nav.heading+TURN*turn*dt);
  const step=(keys.forward?1:0)-(keys.backward?1:0);
  if(step){advance(step*SPEED*dt);walking=true;nav.finished=false;}
 }
 placeAvatar();animation(walking,dt,t);cameraStep();
 if(t-lastHud>150){lastHud=t;updateHud();}
 if(t-lastSave>3000){lastSave=t;save();}
 updateMarkers();renderer.render(scene,camera);
}
requestAnimationFrame(loop);
function startLap(){
 nav.lat=0;nav.lon=0;nav.heading=HALF;
 nav.auto=true;nav.autoDistance=0;nav.finished=false;
 for(const k in keys)keys[k]=false;
 setMode('ground');save();
}
function stop(){
 nav.auto=false;nav.autoDistance=0;
 for(const k in keys)keys[k]=false;save();
}
el('sex').onclick=()=>{
 const next=localStorage.getItem('frontier-planet-avatar-sex')==='female'?'male':'female';
 try{localStorage.setItem('frontier-planet-avatar-sex',next);}catch(_){}
 avatarLoadSequence++;mixer?.stopAllAction();mixer=null;playing=null;clips=[];
 body.clear();body.add(placeholder());isFallback=true;modelName='仮3Dモデル（'+(next==='female'?'女性':'男性')+'）';
 loadAvatar().catch(console.warn);
};
el('globe').onclick=()=>setMode('globe');
el('ground').onclick=()=>setMode('ground');
el('east').onclick=()=>{stop();nav.heading=HALF;};
el('north').onclick=()=>{stop();nav.heading=0;};
el('lap').onclick=startLap;el('stop').onclick=stop;
el('origin').onclick=()=>{
 stop();nav.lat=0;nav.lon=0;nav.heading=HALF;nav.finished=false;
 setMode(nav.mode);save();
};
document.querySelectorAll('[data-hold]').forEach(b=>{
 const key=b.dataset.hold;
 b.addEventListener('pointerdown',e=>{
  e.preventDefault();nav.auto=false;keys[key]=true;b.classList.add('active');
  try{b.setPointerCapture(e.pointerId);}catch(_){}
 });
 const end=()=>{keys[key]=false;b.classList.remove('active');};
 for(const event of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(event,end);
});
function keyFromEvent(e){
 const k=e.key.toLowerCase();
 if(k==='w'||e.key==='ArrowUp')return 'forward';
 if(k==='s'||e.key==='ArrowDown')return 'backward';
 if(k==='a'||e.key==='ArrowLeft')return 'left';
 if(k==='d'||e.key==='ArrowRight')return 'right';
 return null;
}
window.addEventListener('keydown',e=>{
 if(['INPUT','SELECT','TEXTAREA'].includes(e.target?.tagName))return;
 const k=keyFromEvent(e);
 if(k){e.preventDefault();nav.auto=false;keys[k]=true;}
 if(e.key.toLowerCase()==='v')setMode(nav.mode==='ground'?'globe':'ground');
});
window.addEventListener('keyup',e=>{const k=keyFromEvent(e);if(k){e.preventDefault();keys[k]=false;}});
window.addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});
window.__FrontierPlanet={
 get coordinates(){return {latitude:degrees(nav.lat),longitude:degrees(nav.lon),heading:degrees(nav.heading)};},
 get laps(){return nav.laps;},get radius(){return R;},
 get circumference(){return C;},startLap,stop,advance,save,setMode
};
console.info('[FrontierPlanet] experimental spherical map initialized; circumference:',C);
</script>
</body>
</html>
