let char='Mio',exp='通常',timer=null,mode='通常',phase=0;
const master=document.getElementById('master'),eye=document.getElementById('eye'),mouth=document.getElementById('mouth'),status=document.getElementById('status');
function render(){master.src=P[char];status.textContent=char+' / '+exp+' / '+mode}
function choose(c){char=c;mio.classList.toggle('on',c==='Mio');riku.classList.toggle('on',c==='Riku');render()}
mio.onclick=()=>choose('Mio');riku.onclick=()=>choose('Riku');
const ex=document.getElementById('expr');names.forEach(n=>{let b=document.createElement('button');b.textContent=n;b.onclick=()=>{exp=n;render()};ex.appendChild(b)});
function setMode(m){mode=m;[normal,blink,talk,conversation].forEach(b=>b.classList.remove('on'));document.getElementById(m==='通常'?'normal':m==='瞬き'?'blink':m==='口パク'?'talk':'conversation').classList.add('on');clearInterval(timer);eye.style.display='none';mouth.style.display='none';phase=0;if(m!=='通常')timer=setInterval(anim,m==='瞬き'?650:220);render()}
function anim(){phase++;eye.style.display=(mode==='瞬き'||mode==='会話')&&phase%7===0?'block':'none';if(mode==='口パク'||mode==='会話'){mouth.style.display=phase%2?'block':'none';mouth.classList.toggle('open',phase%3===0)}}
normal.onclick=()=>setMode('通常');blink.onclick=()=>setMode('瞬き');talk.onclick=()=>setMode('口パク');conversation.onclick=()=>setMode('会話');render();
</script></main></html>
